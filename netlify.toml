[build]
  command = "cd server && npm install && cd ../client && npm install && CI=false npm run build"
  publish = "client/dist"

[functions]
  directory = "server"

# Proxy /api requests to the serverless function - MUST BE FIRST
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Redirects for Single Page App - Catch-all MUST BE LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
